name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }} 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: |
          MSG=$(grep -E "^e: |What went wrong|Could not|error:" -A2 build.log | head -60 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${MSG}"
      - uses: actions/upload-artifact@v4
        with:
          name: symphony-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Symphony.apk
          # Reuse the release when it exists; create it only the first time.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Symphony.apk --clobber
            gh release edit latest --title "Symphony build ${{ github.run_number }}" --target "$GITHUB_SHA"
          else
            gh release create latest Symphony.apk --title "Symphony build ${{ github.run_number }}" --notes "APK compilé automatiquement depuis la branche main." --target "$GITHUB_SHA"
          fi
